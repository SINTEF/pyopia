[project]
name = "PyOPIA"
dynamic = ["version"]
description = "A Python Ocean Particle Image Analysis toolbox."
authors = [
    { name = "Emlyn Davies", email = "emlyn.davies@sintef.no" },
    { name = "Alex Nimmo Smith", email = "alex@nimmosmith.co.uk" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = "~=3.12.0"
readme = "README.md"
keywords = [
    "Ocean",
    "Particles",
    "Imaging",
    "Measurement",
    "Size distribution",
]
dependencies = [
    "flake8>=6.1.0,<7",
    "numpy>=1.24.0",
    "scipy>=1.11.2,<2",
    "pytest>=7.2.0",
    "pytest-timeout>=2.3.1,<3",
    "pytest-rerunfailures>=14.0,<15",
    "imageio>=2.31.3,<3",
    "matplotlib>=3.7",
    "tqdm>=4.66.1,<5",
    "pytest-error-for-skips>=2.0.2,<3",
    "nbclient==0.7",
    "sphinx==5.0",
    "sphinx-rtd-theme>=0.5.0",
    "sphinxcontrib-napoleon>=0.7",
    "sphinx-togglebutton>=0.3.2,<0.4",
    "sphinx-copybutton>=0.5.2,<0.6",
    "readthedocs-sphinx-search>=0.3.2,<0.4",
    "myst-nb>=0.17.2,<0.18",
    "jupyter-book>=0.15.1,<0.16",
    "ipykernel>=6.19.4",
    "urllib3>=2.5.0,<3",
    "gdown>=5.2.2,<7",
    "cmocean>=3.0.3,<4",
    "toml>=0.10.2,<0.11",
    "xarray>=2023.12.0,<2024",
    "typer[all]>=0.9.0,<0.10",
    "pandas[computation]>=2.1.1,<3",
    "h5py>=3.9.0,<4",
    "poetry-version-plugin>=0.2.0,<0.3",
    "dask>=2024.8.1",
    "nbconvert>=7.16.4,<8",
    "h5netcdf>= 1.3.0",
    "scikit-image>=0.24.0,<0.25",
    "click<8.2.0",
    "seaborn>=0.13.2",
    "pydantic>=2.11.7",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]

classification = [
    "tensorflow>=2.19.0",
    "keras>=3.13.2,<4",
]

classification-torch = [
    "torch>=2.1.0",
]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.0,<6",
]

[project.urls]
Repository = "https://github.com/sintef/pyopia"
Documentation = "https://pyopia.readthedocs.io"

[project.scripts]
pyopia = "pyopia.cli:app"

[tool.hatch.build.targets.sdist]
include = ["pyopia"]

[tool.hatch.build.targets.wheel]
include = ["pyopia"]

[tool.hatch.version]
path = "pyopia/__init__.py"

[tool.pytest.ini_options]
markers = [
    "slow: real network downloads and/or real model inference; excluded from `pytest -m \"not slow\"` for a fast local loop, but still run in routine CI",
    "training: trains a model from scratch (e.g. notebook-based training tutorials); never runs in routine CI, only manually or on a schedule",
]
timeout = 600

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
